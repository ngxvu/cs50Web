{% extends "auctions/layout.html" %}

{% block body %}
    <h2 class="mb-4">Categories</h2>
    <div class="row">
        {% for category in categories %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ category.name }}</h5>
                        <a href="{% url 'category_listings' category.id %}" class="btn btn-primary">View Listings</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
