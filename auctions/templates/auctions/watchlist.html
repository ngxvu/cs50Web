{% extends "auctions/layout.html" %}

{% block body %}
    <h2 class="mb-4">Your Watchlist</h2>
    <div class="row">
        {% for listing in watchlist %}
            <div class="col-md-4 mb-4">
                <div class="card ebay-card">
                    {% if listing.image_url %}
                        <img src="{{ listing.image_url }}" class="card-img-top" alt="{{ listing.title }}">
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ listing.title }}</h5>
                        <p class="card-text">{{ listing.description|truncatewords:20 }}</p>
                        <p class="card-text"><strong>Current Price: ${{ listing.current_bid }}</strong></p>
                        <a href="{% url 'listing_view' listing.id %}" class="btn btn-primary">View Listing</a>
                        <a href="{% url 'remove_from_watchlist' listing.id %}" class="btn btn-danger">Remove</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
