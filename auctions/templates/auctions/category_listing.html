{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Listings in {{ category.name }}</h2>
    <div>
        {% for listing in listings %}
            <div>
                <h3><a href="{% url 'listing_view' listing.id %}">{{ listing.title }}</a></h3>
                <p>{{ listing.description }}</p>
                <p>Current Price: ${{ listing.current_bid }}</p>
                {% if listing.image_url %}
                    <img src="{{ listing.image_url }}" alt="{{ listing.title }}" style="max-width: 200px;">
                {% endif %}
            </div>
        {% endfor %}
    </div>
{% endblock %}
